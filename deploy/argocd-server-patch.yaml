# Template rendered by scripts/release-assets.mjs for an exact repository and release tag.
# Strategic merge patch. Review existing /tmp volume names before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: argocd
spec:
  template:
    spec:
      initContainers:
        - name: argocd-extension-installer-karpenter-manager
          image: quay.io/argoprojlabs/argocd-extension-installer:v1.1.0@sha256:6cc786ba4dc96ba81d5010fbf92adabef15aff89753a55e22b8d829cd8b6e2a8
          env:
            - name: EXTENSION_NAME
              value: karpenter-manager
            - name: EXTENSION_VERSION
              value: '__TAG__'
            - name: EXTENSION_URL
              value: 'https://github.com/__REPOSITORY__/releases/download/__TAG__/karpenter-manager.tar.gz'
            - name: EXTENSION_CHECKSUM_URL
              value: 'https://github.com/__REPOSITORY__/releases/download/__TAG__/checksums.txt'
            - name: EXTENSIONS_DIR
              value: /tmp/extensions/resources
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: argocd-server
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: karpenter-manager-config
              mountPath: /tmp/extensions/resources/extension-0-karpenter-manager-config.js
              subPath: extension-0-karpenter-manager-config.js
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: karpenter-manager-config
          configMap:
            name: karpenter-manager-config
