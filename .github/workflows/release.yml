name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@e797f83bcb11b83ae66a0230d3a2a8e837b7e4e2 # v6.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Validate release identity before installing dependencies
        run: node scripts/release-assets.mjs --validate-only
      - run: npm install --global npm@11.19.1
      - run: npm ci
        working-directory: extension
      - run: npm run typecheck
        working-directory: extension
      - run: npm test
        working-directory: extension
      - run: npm run build
        working-directory: extension
      - run: npm run package
        working-directory: extension
      - run: npm audit --audit-level=moderate
        working-directory: extension
      - run: pip install -r api/requirements-dev.txt
      - run: python -m pytest -q
      - name: Prepare release checksums
        run: node scripts/release-assets.mjs
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$RELEASE_REPOSITORY" --verify-tag --generate-notes \
            dist/karpenter-manager.tar.gz dist/checksums.txt dist/release-info.txt deploy/application.yaml deploy/argocd-patches.yaml
